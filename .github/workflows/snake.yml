name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Tanmay2006-Tech
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_dots=#2d3343,#10b981,#22d3ee,#7c3aed,#a78bfa&color_snake=#a78bfa
            dist/snake-light.svg?palette=github-light&color_dots=#e5e7eb,#10b981,#0891b2,#7c3aed,#a78bfa&color_snake=#7c3aed

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
